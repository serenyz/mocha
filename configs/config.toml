[mainConfig]
appName = "mocha"
Host = "127.0.0.1"
Port = 6666


[mysqlConfig]
host = "127.0.0.1"
port = 3306
user = "mocha"
password = "123456"
databaseName = "mocha"
maxIdleConns = 10
maxOpenConns = 100
connMaxLifetime = 3600

[logConfig]
path = "./logs/app.log"
level = "debug"
maxSize =    100
maxBackups = 30
maxAge =     7

[staticSrcConfig]
staticAvatarPath = "./static/avatars"
staticFilePath = "./static/files"

[redisConfig]
host = "127.0.0.1"
port = 6379
password = "123456"
db = 0
poolSize = 20
minIdleConns = 5
messageChannel = "chat.message.push.v1"

[kafkaConfig]
brokers = ["127.0.0.1:9092"]
clientID = "mocha"
commandTopic = "chat.message.command.v1"
committedTopic = "chat.message.committed.v1"
writerGroup = "mocha-message-writer"
pushGroup = "mocha-message-push"
batchSize = 1024
batchWait = "5s"
dialTimeout = "3s"
produceTimeout = "3s"
writerTimeout = "10m"
writerRetry = "1s"
pushTimeout = "10s"
pushRetry = "1s"

[webSocketConfig]
allowedOrigins = ["http://127.0.0.1:5173"]
handshakeTimeout = "5s"
pingInterval = "25s"
pongTimeout = "60s"
writeTimeout = "10s"
maxMessageSize = 65536
sendQueueSize = 256
ticketTTL = '30s'

[authConfig]
issuer = "mocha"
accessTokenTTL = "15m"
refreshTokenTTL = "720h"
registerCodeTTL            = "5m"
registerCodeResendInterval  = "60s"
registerCodePhoneHourlyLimit = 5

[minioConfig]
endpoint = "127.0.0.1:9000"
bucket = "mocha"
region = "cn-north-1"
useSSL = false
