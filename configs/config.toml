[mainConfig]
appName = "mocha"
Host = "127.0.0.1"
Port = 6666


[mysqlConfig]
host = "127.0.0.1"
port = 3306
user = "mocha"
password = "123456"
databaseName = "mocha"
maxIdleConns = 10
maxOpenConns = 100
connMaxLifetime = 3600

[logConfig]
path = "./logs/app.log"
level = "debug"
maxSize =    100
maxBackups = 30
maxAge =     7

[staticSrcConfig]
staticAvatarPath = "./static/avatars"
staticFilePath = "./static/files"

[redisConfig]
host = "127.0.0.1"
port = 6379
password = "123456"
db = 0
poolSize = 20
minIdleConns = 5

[authConfig]
issuer = "mocha"
accessTokenTTL = "15m"
refreshTokenTTL = "720h"
registerCodeTTL            = "5m"
registerCodeResendInterval  = "60s"
registerCodePhoneHourlyLimit = 5

[minioConfig]
endpoint = "127.0.0.1:9000"
bucket = "mocha"
region = "cn-north-1"
useSSL = false